<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile add task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457C5}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;color:#1B2438;font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden">

<div style="flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:16px 12px;border-bottom:1px solid #DDE4EF">
<a href="MobileTasks.dc.html" aria-label="Back to tasks" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#1B2438;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin:0;font-size:20px;font-weight:800">Add task</h1>
<span style="margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:4px"><span style="font-size:16px;font-weight:800;letter-spacing:-.02em">Slate</span><span style="position:relative;flex:0 0 auto;width:32px;height:32px;border-radius:13px;background:linear-gradient(160deg,#4C86F0 0%,#2457C5 55%,#1A3F94 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 3px 0 #173E94,0 8px 12px -4px rgba(36,87,197,.5)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l8.5 4.2L12 12 3.5 7.7z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><path d="M3.5 12l8.5 4.2 8.5-4.2" stroke="#CFE0FB" stroke-width="2"/><path d="M3.5 16.2l8.5 4.3 8.5-4.3" stroke="#93B4F0" stroke-width="2"/></svg><span style="position:absolute;right:-3px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#1E9E68;border:2px solid #FFFFFF;box-sizing:border-box"></span></span></span>
</div>

<div style="flex:1;min-height:0;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:16px">

<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Task title
<input type="text" placeholder="What needs to be done?" style="height:48px;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid #C5CFDF;font-family:inherit;font-size:15px"></label>

<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Category
<select style="height:48px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:1px solid #C5CFDF;background:#FFFFFF;font-family:inherit;font-size:15px"><option>Development</option><option>Data Cleaning</option><option>Data Management</option><option>Power BI</option></select></label>

<div style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Priority
<div style="display:flex;gap:8px">
<button type="button" style="flex:1;height:44px;border-radius:12px;border:1px solid #C5CFDF;background:#FFFFFF;color:#4A556B;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Low</button>
<button type="button" style="flex:1;height:44px;border-radius:12px;border:1px solid #2457C5;background:#E4EDFC;color:#1A3F94;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">Medium</button>
<button type="button" style="flex:1;height:44px;border-radius:12px;border:1px solid #C5CFDF;background:#FFFFFF;color:#4A556B;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">High</button>
</div></div>

<div style="display:flex;gap:12px">
<label style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Tentative
<input type="date" style="height:48px;box-sizing:border-box;width:100%;padding:0 10px;border-radius:12px;border:1.5px dashed #2457C5;font-family:inherit;font-size:14px"></label>
<label style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Fixed
<input type="date" style="height:48px;box-sizing:border-box;width:100%;padding:0 10px;border-radius:12px;border:1px solid #F3BFBF;background:#FFF8F8;font-family:inherit;font-size:14px"></label>
</div>
<p style="margin:-6px 0 0;font-size:12px;line-height:1.5;color:#5B667D">Tentative is your own target. Fixed is the committed date and drives your on-time score.</p>

<div style="display:flex;gap:12px">
<label style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Estimated hours
<input type="number" min="0" step="0.5" placeholder="0" style="height:48px;box-sizing:border-box;width:100%;padding:0 14px;border-radius:12px;border:1px solid #C5CFDF;font-family:inherit;font-size:15px"></label>
<label style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Status
<select style="height:48px;box-sizing:border-box;width:100%;padding:0 10px;border-radius:12px;border:1px solid #C5CFDF;background:#FFFFFF;font-family:inherit;font-size:15px"><option>To do</option><option>In progress</option><option>Waiting</option></select></label>
</div>

<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Notes
<textarea rows="3" placeholder="Optional details" style="box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid #C5CFDF;font-family:inherit;font-size:15px;resize:none"></textarea></label>

</div>

<div style="flex:0 0 auto;display:flex;gap:12px;padding:12px 16px 20px;border-top:1px solid #DDE4EF;background:#FFFFFF">
<a href="MobileTasks.dc.html" style="flex:1;height:48px;border-radius:12px;border:1px solid #C5CFDF;background:#FFFFFF;color:#1B2438;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Cancel</a>
<a href="MobileTasks.dc.html" style="flex:2;height:48px;border-radius:12px;background:#2457C5;color:#FFFFFF;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">Save task</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
