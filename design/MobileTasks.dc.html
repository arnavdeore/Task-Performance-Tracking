<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457C5}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F7FB;color:#1B2438;font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden">

<div style="flex:1;min-height:0;overflow-y:auto;padding:20px 16px 16px;display:flex;flex-direction:column;gap:16px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<div style="display:flex;align-items:center;gap:10px"><span style="position:relative;flex:0 0 auto;width:38px;height:38px;border-radius:14px;background:linear-gradient(160deg,#4C86F0 0%,#2457C5 55%,#1A3F94 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 3px 0 #173E94,0 8px 12px -4px rgba(36,87,197,.5)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l8.5 4.2L12 12 3.5 7.7z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/><path d="M3.5 12l8.5 4.2 8.5-4.2" stroke="#CFE0FB" stroke-width="2"/><path d="M3.5 16.2l8.5 4.3 8.5-4.3" stroke="#93B4F0" stroke-width="2"/></svg><span style="position:absolute;right:-3px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#1E9E68;border:2px solid #FFFFFF;box-sizing:border-box"></span></span><h1 style="margin:0;font-size:22px;font-weight:800">Tasks</h1></div>
<button type="button" aria-label="Filter by category" style="width:44px;height:44px;border-radius:12px;border:1px solid #DDE4EF;background:#FFFFFF;color:#4A556B;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
</div>

<input type="search" aria-label="Search tasks" placeholder="Search tasks" style="box-sizing:border-box;width:100%;height:44px;padding:0 16px;border-radius:12px;border:1px solid #DDE4EF;background:#FFFFFF;font-family:inherit;font-size:14px">

<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px">
<button type="button" style="flex:0 0 auto;height:44px;padding:0 16px;border-radius:999px;border:1px solid #DDE4EF;background:#FFFFFF;color:#4A556B;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">To do 4</button>
<button type="button" style="flex:0 0 auto;height:44px;padding:0 16px;border-radius:999px;border:1px solid #2457C5;background:#E4EDFC;color:#1A3F94;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">In progress 3</button>
<button type="button" style="flex:0 0 auto;height:44px;padding:0 16px;border-radius:999px;border:1px solid #DDE4EF;background:#FFFFFF;color:#4A556B;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">Waiting 2</button>
<button type="button" style="flex:0 0 auto;height:44px;padding:0 16px;border-radius:999px;border:1px solid #DDE4EF;background:#FFFFFF;color:#4A556B;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">Done 3</button>
</div>

<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<article style="background:#FFFFFF;border:1px solid #DDE4EF;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
<span style="font-size:15px;font-weight:600;line-height:1.35">{{t.title}}</span>
<span style="flex:0 0 auto;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:{{t.catBg}};color:{{t.catFg}}">{{t.cat}}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px">
<span style="padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#FFFFFF;border:1.5px dashed #2457C5;color:#2457C5">Tentative {{t.tent}}</span>
<span style="padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#FCE6E6;color:#A12B2B;border:1px solid #F3BFBF">Fixed {{t.fixed}}</span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<span style="font-size:12px;font-weight:600;color:{{t.footFg}}">{{t.foot}}</span>
<button type="button" style="height:44px;padding:0 16px;border-radius:10px;border:1px solid #1E9E68;background:#E1F4EA;color:#0F6B43;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">Mark done</button>
</div>
</article>
</sc-for>
</div>

</div>

<nav aria-label="Main" style="height:72px;flex:0 0 auto;background:#FFFFFF;border-top:1px solid #DDE4EF;display:flex;align-items:center;justify-content:space-around;padding:0 8px">
<a href="MobileHome.dc.html" style="min-width:56px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#4A556B;font-size:11px;font-weight:600;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
<a href="MobileTasks.dc.html" aria-current="page" style="min-width:64px;min-height:52px;box-sizing:border-box;padding:0 10px;border-radius:16px;background:linear-gradient(180deg,#F4F8FF,#E1EBFC);box-shadow:0 1px 0 #FFFFFF inset,0 3px 0 #C7D8F5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#2457C5;font-size:11px;font-weight:700;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12.5l3 3 5-6"/></svg>Tasks</a>
<a href="MobileAdd.dc.html" aria-label="Add task" style="width:52px;height:52px;border-radius:50%;background:#2457C5;color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="#" style="min-width:56px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#4A556B;font-size:11px;font-weight:600;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Stats</a>
<a href="#" style="min-width:56px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#4A556B;font-size:11px;font-weight:600;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Settings</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tasks = [
      { title: 'Review sales dashboard KPIs', cat: 'Power BI', catBg: '#FBEFD2', catFg: '#7A5200', tent: '10 Oct', fixed: '11 Oct', foot: 'Overdue by 2 days', footFg: '#A12B2B' },
      { title: 'Fix sync script bug', cat: 'Development', catBg: '#E4EDFC', catFg: '#1A3F94', tent: '13 Oct', fixed: '15 Oct', foot: 'Est 3h, 2h logged', footFg: '#1A3F94' },
      { title: 'Clean customer export file', cat: 'Data Cleaning', catBg: '#E1F4EA', catFg: '#0F6B43', tent: '14 Oct', fixed: '16 Oct', foot: 'Est 4h, 1.5h logged', footFg: '#1A3F94' }
    ];
    return { tasks };
  }
}
</script>
</body>
</html>
